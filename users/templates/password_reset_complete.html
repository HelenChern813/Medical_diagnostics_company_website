{% extends 'base.html' %}

{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success shadow-lg">
                <div class="card-header bg-success text-white">
                    <h2 class="h4 mb-0"><i class="bi bi-check-circle me-2"></i>Пароль изменен</h2>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-shield-check text-success fs-1 mb-3"></i>
                    <p class="lead">Ваш пароль был успешно изменен!</p>
                    <a href="{% url 'users:login' %}" class="btn btn-success">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Войти с новым паролем
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
