{% extends 'base.html' %}

{% block content %}
<h1>Результаты диагностики</h1>

<table class="table">
    <thead>
        <tr>
            <th>Дата</th>
            <th>Услуга</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for result in results %}
        <tr>
            <td>{{ result.date_performed|date:"d.m.Y H:i" }}</td>
            <td>{{ result.service.name }}</td>
            <td>{{ result.get_status_display }}</td>
            <td>
                <a href="{% url 'medical_diagnostic:diagnostic_results_detail' result.pk %}" class="btn btn-sm btn-info">Просмотр</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
