{% extends 'base.html' %}

{% block title %}Услуги{% endblock %}

{% block content %}
<div class="container">
  <h2 class="mb-4">Наши услуги</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for service in services %}
    <div class="col">
      <div class="card h-100">
        {% if service.photo %}
        <img src="{{ service.photo.url }}" class="card-img-top" alt="{{ service.name }}">
        {% endif %}
        <div class="card-body">
          <h5 class="card-title">{{ service.name }}</h5>
          <p class="card-text">{{ service.description|truncatechars:100 }}</p>
          <div class="d-flex justify-content-between align-items-center">
            <span class="badge bg-primary rounded-pill">{{ service.price }} руб.</span>
            <a href="{% url 'medical_diagnostic:service_detail' service.pk %}" class="btn btn-sm btn-outline-primary">
              Подробнее
            </a>
          </div>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MedicalBusiness",
  "name": "{{ company.name }}",
  "description": "Медицинский диагностический центр",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{ company.address }}"
  },
  "telephone": "{{ company.phone_company }}"
}
</script>
{% endblock %}
