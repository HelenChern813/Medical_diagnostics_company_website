{% extends 'base.html' %}

{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-success shadow-lg">
                <div class="card-header bg-success text-white">
                    <h2 class="h4 mb-0"><i class="bi bi-envelope-check me-2"></i>Письмо отправлено</h2>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-check-circle-fill text-success fs-1 mb-3"></i>
                    <p class="lead">Инструкции по сбросу пароля отправлены на ваш email.</p>
                    <p>Если вы не получили письмо, проверьте папку "Спам" или попробуйте еще раз.</p>
                    <a href="{% url 'users:reset_password' %}" class="btn btn-outline-success">
                        <i class="bi bi-arrow-repeat me-2"></i>Отправить повторно
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
